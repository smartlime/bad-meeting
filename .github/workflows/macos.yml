name: macOS
on:
  push:
    branches: [dev, main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: desktop/macos/scripts/test.sh
      - name: Build
        run: desktop/macos/scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Bad-Meeting-macOS
          path: |
            desktop/macos/dist/*.zip
            desktop/macos/dist/*.sha256
